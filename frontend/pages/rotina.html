<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Premium - Rotina Diária</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    /* Estilos específicos da tela de Rotina e Modais */
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    .filter-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-tab.active, .filter-tab:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Modal / Diálogo de Registro */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-control {
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--primary);
    }
    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
    }
  </style>
  <script src="../js/auth.js"></script>
  <script>
    // Redireciona caso o usuário não esteja logado
    AuthService.protegerRota("login.html");
  </script>
</head>
<body>

  <div class="app-container">
    <!-- SIDEBAR (Exibida no Computador) -->
    <aside class="sidebar">
      <div class="logo-container" style="margin-bottom: 2rem; display: flex; align-items: center; gap: 0.75rem;">
  <img src="../assets/images/logo.png" alt="Babá Premium Logo" style="max-width: 180px; height: auto; display: block;">
</div>
      <nav style="display: flex; flex-direction: column; gap: 1rem;">
        <a href="dashboard.html" style="color: var(--text-muted); text-decoration: none;">🏠 Dashboard</a>
        <a href="rotina.html" style="color: var(--primary); font-weight: bold; text-decoration: none;">📅 Rotina Diária</a>
        <a href="saude.html" style="color: var(--text-muted); text-decoration: none;">🩺 Saúde & Vacinas</a>
        <a href="estatisticas.html" style="color: var(--text-muted); text-decoration: none;">📊 Gráficos</a>
        <a href="notas.html" style="color: var(--text-muted); text-decoration: none;">📝 Diário</a>
        <a href="galeria.html" style="color: var(--text-muted); text-decoration: none;">📷 Fotos & Vídeos</a>
        <a href="perfil-bebe.html" style="color: var(--text-muted); text-decoration: none;">👤 Perfil</a>
        <a href="#" onclick="AuthService.logout(); return false;" style="color: var(--text-muted); text-decoration: none;">🚪 Sair</a>
      </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
      <!-- Bebê ativo + "Trocar bebê" (bebe-ativo.js) -->
      <div id="seletor-bebe" class="seletor-bebe-barra"></div>
      
      <!-- CABEÇALHO DA SEÇÃO -->
      <section class="baby-card" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h2>Rotina Diária</h2>
          <p style="color: var(--text-muted); font-size: 0.85rem;" id="data-hoje"></p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <input type="date" id="rotina-data-input" class="form-control" style="font-size: 0.8rem; padding: 0.4rem 0.6rem;">
        </div>
      </section>

      <!-- BOTÕES DE NOVO REGISTRO -->
      <section class="quick-action-grid">
        <button class="quick-action-btn" onclick="abrirModal('alimentacao')">
          <span class="icon">🍼</span>
          <span class="label">Alimentação</span>
          <span class="sub">+ Registrar</span>
        </button>
        <button class="quick-action-btn" onclick="abrirModal('fralda')">
          <span class="icon">🧷</span>
          <span class="label">Fralda</span>
          <span class="sub">+ Troca</span>
        </button>
        <button class="quick-action-btn" onclick="abrirModal('sono')">
          <span class="icon">💤</span>
          <span class="label">Sono / Soneca</span>
          <span class="sub">+ Registrar</span>
        </button>
      </section>

      <!-- FILTRO DE CATEGORIAS -->
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filtrarTimeline('todos', this)">Todos</button>
        <button class="filter-tab" onclick="filtrarTimeline('alimentacao', this)">🍼 Alimentação</button>
        <button class="filter-tab" onclick="filtrarTimeline('fralda', this)">🧷 Fraldas</button>
        <button class="filter-tab" onclick="filtrarTimeline('sono', this)">💤 Sono</button>
        <button class="filter-tab" onclick="filtrarTimeline('outros', this)">✨ Outros</button>
      </div>

      <!-- FEED DA ROTINA (TIMELINE) -->
      <div class="baby-card">
        <h4 style="margin-bottom: 1.25rem;">Histórico de Atividades</h4>
        <div class="timeline-list" id="lista-atividades">
          <p class="estado-vazio">Carregando...</p>
        </div>
      </div>

    </main>

    <!-- BARRA INFERIOR MOBILE -->
    <nav class="bottom-nav">
      <a href="dashboard.html"><span>🏠</span>Início</a>
      <a href="rotina.html" class="active"><span>📅</span>Rotina</a>
      <a href="saude.html"><span>🩺</span>Saúde</a>
      <a href="estatisticas.html"><span>📊</span>Gráficos</a>
      <a href="galeria.html"><span>📷</span>Galeria</a>
      <a href="perfil-bebe.html"><span>👤</span>Perfil</a>
    </nav>
  </div>

  <!-- MODAL DE REGISTRO RÁPIDO -->
  <div class="modal-overlay" id="modal-registro">
    <div class="modal-card">
      <h3 id="modal-titulo">Novo Registro</h3>
      
      <form id="form-rotina" onsubmit="salvarRegistro(event)">
        <div id="campos-dinamicos" style="display: flex; flex-direction: column; gap: 0.85rem;">
          <!-- Preenchido via registro-rotina.js conforme a ação -->
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn-cancel" style="flex: 1;" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn-submit" style="flex: 1;">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/foto.js"></script>
  <script src="../js/bebe-ativo.js"></script>
  <script src="../js/registro-rotina.js"></script>
  <script src="../js/rotina.js"></script>
</body>
</html>
