<form [formGroup]="form" (ngSubmit)="entrar()">
  <app-mensagem [texto]="mensagem()?.texto" [tipo]="mensagem()?.tipo ?? 'erro'" />

  <div class="form-group">
    <label for="login-email">E-mail</label>
    <input type="email" id="login-email" class="form-control" formControlName="email" placeholder="exemplo@email.com" autocomplete="email">
  </div>

  <div class="form-group">
    <label for="login-senha">Senha</label>
    <input type="password" id="login-senha" class="form-control" formControlName="senha" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button type="submit" class="btn-submit largo" [disabled]="enviando()">
    {{ enviando() ? 'Verificando...' : 'Entrar no Sistema' }}
  </button>
</form>
