@let n = nota();
<article class="note-card">
  <div>
    <div class="note-header">
      <span class="note-tag" [class]="'tag-' + n.tag.toLowerCase()">{{ (tags[n.tag] || tags.GERAL).rotulo }}</span>
      <span class="note-date">{{ n.dataHora | dataHoraBr }}</span>
    </div>
    <h4 class="note-title">{{ n.titulo }}</h4>
    <p class="note-body">{{ n.texto }}</p>
  </div>
  <div class="note-footer">
    <span class="texto-apoio">por {{ n.autorNome || '—' }}{{ n.atualizadoEm ? ' • editada' : '' }}</span>
    @if (propria()) {
      <span class="acoes">
        <button type="button" class="btn-outline" (click)="editar.emit(n)">Editar</button>
        <button type="button" class="btn-delete-note" (click)="excluir.emit(n)">Excluir</button>
      </span>
    }
  </div>
</article>
