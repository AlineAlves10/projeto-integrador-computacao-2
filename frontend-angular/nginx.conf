# Servir o build de produção (dist/frontend-angular/browser) em um nginx.
# As rotas do Angular (/rotina, /perfil...) não existem como arquivos: todas caem no index.html.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 55M;

  location ^~ /api/ {
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Prefix /api;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Arquivos com hash no nome podem ficar em cache; o index.html não
  location ~* \.(js|css|png|svg|ico|woff2?)$ {
    expires 30d;
    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
