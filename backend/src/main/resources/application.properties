spring.application.name=baby-premium-backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/baby_premium_db
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# Autenticação (JWT). Defina JWT_SECRET (mín. 32 caracteres) fora do repositório;
# sem ele a API gera uma chave temporária a cada inicialização.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-minutos=480

# Upload de fotos de perfil dos bebês (JPEG, PNG ou WebP, até 5 MB, conferido em FotoBebeService)
app.uploads.dir=${UPLOADS_DIR:uploads/fotos-bebes}
# Galeria privada (fotos até 10 MB, vídeos MP4/MOV/WebM até 50 MB, conferidos em MidiaService)
app.midias.dir=${MIDIAS_DIR:uploads/midias-bebes}
# Limite do multipart = maior arquivo aceito (vídeo) + miniatura e descrição
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=53MB

# Ajustes de esquema que o ddl-auto=update não faz (ex.: remover NOT NULL). Script idempotente.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/ajustes-esquema.sql
spring.jpa.defer-datasource-initialization=true
