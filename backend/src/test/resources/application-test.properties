# Perfil usado pelos testes automatizados: H2 em memória no modo PostgreSQL
spring.datasource.url=jdbc:h2:mem:babapremium;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never
app.uploads.dir=${java.io.tmpdir}/baba-premium-test-uploads
app.midias.dir=${java.io.tmpdir}/baba-premium-test-midias
