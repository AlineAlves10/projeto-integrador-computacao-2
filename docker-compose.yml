services:
  postgres-db:
    image: postgres:16-alpine
    container_name: baby_premium_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: baby_premium_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - pgdata_premium:/var/lib/postgresql/data

  # Front-end Angular: build de produção servido por nginx (frontend-angular/Dockerfile).
  # A API é chamada em http://localhost:8080 a partir de http://localhost:3000 (origem liberada no CORS).
  frontend:
    build: ./frontend-angular
    container_name: baby_premium_front
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - postgres-db

volumes:
  pgdata_premium: 